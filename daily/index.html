<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日の1問｜しぃとのホームページ</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body data-page="daily" data-depth="child">
  <button class="menu-button" id="menuButton" aria-label="メニューを開く">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="overlay" id="overlay"></div>

  <div id="commonSidebar"></div>

  <main class="main-content daily-main">
    <section class="hero">
      <h1>今日の1問</h1>
      <p>問題は毎朝6時に更新されます．</p>

      <div class="daily-difficulty-area" aria-label="今日の1問の難易度選択">
        <button
          type="button"
          class="daily-difficulty-button is-selected"
          data-daily-difficulty="1"
          aria-pressed="true"
        >
          基本
        </button>

        <button
          type="button"
          class="daily-difficulty-button is-selected"
          data-daily-difficulty="2"
          aria-pressed="true"
        >
          標準
        </button>

        <button
          type="button"
          class="daily-difficulty-button is-selected"
          data-daily-difficulty="3"
          aria-pressed="true"
        >
          応用
        </button>
      </div>
    </section>

    <section class="content-section">
      <div class="daily-heading-row">
        <h2>今日の問題</h2>

        <span class="daily-practiced-badge is-hidden" id="dailyPracticedBadge">
          演習済み
        </span>
      </div>

      <div class="daily-action-area">
        <button type="button" class="daily-reselect-button" id="dailyReselectButton">
          既習範囲から選び直す
        </button>
      </div>

      <div id="dailyProblemArea">
        読み込み中です．
      </div>
    </section>
  </main>

  <script src="../common-loader.js"></script>
</body>
</html>
