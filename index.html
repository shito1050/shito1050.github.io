<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しぃとのホームページ</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #fffafc;
      color: #333333;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background-color: #ffd9ec;
      padding: 24px 16px;
      box-sizing: border-box;
    }

    .sidebar h2 {
      margin-top: 0;
      font-size: 24px;
      color: #cc3366;
    }

    .sidebar a {
      display: block;
      margin: 12px 0;
      padding: 10px 12px;
      text-decoration: none;
      color: #333333;
      background-color: #fff5fa;
      border-radius: 10px;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .sidebar a:hover {
      background-color: #ffffff;
      transform: translateX(4px);
    }

    .main-content {
      flex: 1;
      padding: 40px;
      box-sizing: border-box;
    }

    .main-content h1 {
      font-family: "HGP創英角ﾎﾟｯﾌﾟ体", "HG創英角ポップ体", sans-serif;
      color: #ff6699;
      border-bottom: 3px solid #ffb6d9;
      padding-bottom: 8px;
      margin-top: 0;
    }

    .menu-button {
      display: none;
    }

    .overlay {
      display: none;
    }

    @media (max-width: 700px) {
      .container {
        display: block;
        min-height: auto;
      }

      .menu-button {
        display: block;
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1001;
        width: 48px;
        height: 48px;
        border: none;
        border-radius: 12px;
        background-color: #ffd9ec;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        cursor: pointer;
        padding: 0;
      }

      .menu-button span {
        display: block;
        width: 24px;
        height: 3px;
        background-color: #cc3366;
        margin: 5px auto;
        border-radius: 2px;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 240px;
        height: 100vh;
        z-index: 1002;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        box-shadow: 4px 0 12px rgba(0, 0, 0, 0.18);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.35);
        z-index: 1000;
      }

      .overlay.show {
        display: block;
      }

      .main-content {
        padding: 72px 16px 24px 16px;
      }
    }
  </style>
</head>
<body>
  <button class="menu-button" id="menuButton" aria-label="メニューを開く">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="overlay" id="overlay"></div>

  <div class="container">
    <div class="sidebar" id="sidebar">
      <h2>メニュー</h2>
      <a href="materials.html">教材</a>
      <a href="article-test.html">ブログ</a>
    </div>

    <div class="main-content">
      <h1>しぃとのホームページ</h1>
      <p>こんにちは．これは私のホームページです．</p>
      <p>メニューから，教材やブログに進めます．</p>
    </div>
  </div>

  <script>
    const menuButton = document.getElementById('menuButton');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    menuButton.addEventListener('click', function() {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    });

    overlay.addEventListener('click', function() {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
</body>
</html>
