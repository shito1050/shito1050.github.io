<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しぃとのホームページ</title>
  <style>
    body {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 16px;
      font-family: sans-serif;
      line-height: 1.8;
      background-color: #fffafc;
      opacity: 1;
      transition: opacity 0.35s ease;
    }

    body.fade-out {
      opacity: 0;
    }

    h1 {
      font-family: "HGP創英角ﾎﾟｯﾌﾟ体", "HG創英角ポップ体", sans-serif;
      color: #ff6699;
      border-bottom: 3px solid #ffb6d9;
      padding-bottom: 8px;
    }

    .menu-link {
      display: inline-block;
      padding: 10px 18px;
      margin: 10px 0;
      background-color: #ffd9ec;
      color: #333333;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      transition:
        transform 0.2s ease,
        background-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .menu-link:hover {
      background-color: #ffbfdc;
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
    }

    .menu-link:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <h1>しぃとのホームページ</h1>
  <p>こんにちは．これは私の最初のホームページです．</p>

  <p><a class="menu-link" href="materials.html">教材</a></p>
  <p><a class="menu-link" href="article-test.html">記事テスト</a></p>

  <script>
    const links = document.querySelectorAll('.menu-link');

    links.forEach(link => {
      link.addEventListener('click', function(event) {
        event.preventDefault();
        const url = this.href;
        document.body.classList.add('fade-out');

        setTimeout(() => {
          window.location.href = url;
        }, 350);
      });
    });
  </script>
</body>
</html>
