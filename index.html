<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しぃとのホームページ</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #fffafc;
      color: #333333;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background-color: #ffd9ec;
      padding: 24px 16px;
      box-sizing: border-box;
    }

    .sidebar h2 {
      margin-top: 0;
      font-size: 24px;
      color: #cc3366;
    }

    .sidebar a {
      display: block;
      margin: 12px 0;
      padding: 10px 12px;
      text-decoration: none;
      color: #333333;
      background-color: #fff5fa;
      border-radius: 10px;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .sidebar a:hover {
      background-color: #ffffff;
      transform: translateX(4px);
    }

    .main-content {
      flex: 1;
      padding: 40px;
      box-sizing: border-box;
    }

    .main-content h1 {
      font-family: "HGP創英角ﾎﾟｯﾌﾟ体", "HG創英角ポップ体", sans-serif;
      color: #ff6699;
      border-bottom: 3px solid #ffb6d9;
      padding-bottom: 8px;
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h2>メニュー</h2>
      <a href="materials.html">教材</a>
      <a href="article-test.html">ブログ</a>
    </div>

    <div class="main-content">
      <h1>しぃとのホームページ</h1>
      <p>こんにちは．これは私のホームページです．</p>
      <p>左のメニューから，教材やブログに進めます．</p>
    </div>
  </div>
</body>
</html>
