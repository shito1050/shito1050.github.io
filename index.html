<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しぃとのホームページ</title>
  <style>
    body {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 16px;
      font-family: sans-serif;
      line-height: 1.8;
      opacity: 1;
      transition: opacity 0.4s;
    }

    body.fade-out {
      opacity: 0;
    }

    .menu-link {
      display: inline-block;
      padding: 10px 18px;
      margin: 8px 0;
      background-color: #ffd9ec;
      color: #333;
      text-decoration: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>しぃとのホームページ</h1>

  <p><a class="menu-link" href="materials.html">教材</a></p>
  <p><a class="menu-link" href="article-test.html">記事テスト</a></p>

  <script>
    const links = document.querySelectorAll('.menu-link');

    links.forEach(link => {
      link.addEventListener('click', function(event) {
        event.preventDefault();
        const url = this.href;

        document.body.classList.add('fade-out');

        setTimeout(() => {
          window.location.href = url;
        }, 400);
      });
    });
  </script>
</body>
</html>
