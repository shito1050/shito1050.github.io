<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定義・用語・公式集｜しぃとのホームページ</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body data-page="dictionary" data-depth="child">
  <button class="menu-button" id="menuButton" aria-label="メニューを開く">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="overlay" id="overlay"></div>

  <div id="commonSidebar"></div>

  <main class="main-content">
    <section class="content-section">
      <div class="definition-card" id="dictionaryTermDetail">
      </div>

      <div class="back-link-area">
        <a href="index.html" id="dictionaryBackLink">定義・用語・公式集へ戻る</a>
      </div>
    </section>
  </main>

  <script src="../common-loader.js"></script>
  <script>
    (function () {
      const backLink = document.getElementById("dictionaryBackLink");

      if (!backLink) {
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const fromSearch = urlParams.get("fromSearch");

      backLink.addEventListener("click", function (event) {
        if (fromSearch !== "1") {
          return;
        }

        event.preventDefault();
        window.close();

        window.setTimeout(function () {
          window.location.href = "index.html";
        }, 150);
      });
    })();
  </script>
</body>
</html>
